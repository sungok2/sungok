name: Galaxy Universal I-O Android debug APK
on:
  push:
    branches: [galaxy-universal-io-m0-7, galaxy-universal-io-m0-8, galaxy-universal-io-ntfs-saf-m0-9, galaxy-universal-io-ntfs-m1-0-hardening, galaxy-universal-io-m0-11-master-ntfs-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Run host regression tests
        run: |
          bash tests/run-host-tests.sh
          bash tests/run-printer-transport-tests.sh
          bash tests/run-imaging-pdf-tests.sh
          bash tests/run-escl-tests.sh
          bash tests/run-ipp-tests.sh
          bash tests/run-reliability-tests.sh
          bash tests/run-usb-http-policy-tests.sh
          bash tests/run-ntfs-saf-tests.sh
          bash tests/run-ntfs-name-tests.sh
          bash tests/run-ntfs-transaction-tests.sh
          bash tests/run-ntfs-audit-tests.sh
          bash tests/run-ntfs-write-probe-tests.sh
          bash tests/run-ntfs-destination-advisor-tests.sh
          bash tests/run-ntfs-failure-advice-tests.sh
          python3 tests/run-android-signature-smoke.py
      - name: Assemble Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature and package metadata
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -F "package: name='com.galaxyuniversalio.m011'" apk-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyUniversalIO-M0.11-MASTER-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/ci-emulator-smoke.sh
      - name: Upload Android runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyUniversalIO-M0.11-MASTER-emulator-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7
