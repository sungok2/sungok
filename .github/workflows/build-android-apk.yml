name: Galaxy Universal I-O Android debug APK
on:
  push:
    branches: [galaxy-universal-io-m0-7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Run host regression tests
        run: |
          bash tests/run-host-tests.sh
          bash tests/run-printer-transport-tests.sh
          bash tests/run-imaging-pdf-tests.sh
          bash tests/run-escl-tests.sh
          bash tests/run-ipp-tests.sh
          bash tests/run-reliability-tests.sh
          bash tests/run-usb-http-policy-tests.sh
          python3 tests/run-android-signature-smoke.py
      - name: Assemble Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature and package metadata
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -F "package: name='com.galaxyuniversalio.debug'" apk-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyUniversalIO-M0.7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
