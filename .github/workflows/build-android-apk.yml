name: Galaxy Universal I-O Android debug APK
on:
  push:
    branches: [galaxy-universal-io-m0-7, galaxy-universal-io-m0-8, galaxy-universal-io-m0-9, galaxy-universal-io-m1-escl-discovery]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.0'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Run host regression tests
        run: |
          bash tests/run-host-tests.sh
          bash tests/run-printer-transport-tests.sh
          bash tests/run-imaging-pdf-tests.sh
          bash tests/run-escl-tests.sh
          bash tests/run-ipp-tests.sh
          bash tests/run-reliability-tests.sh
          bash tests/run-usb-http-policy-tests.sh
          python3 tests/run-android-signature-smoke.py
      - name: Run LAN eSCL capability and scan integration
        run: |
          SCANNER_IP="$(hostname -I | awk '{print $1}')"
          python3 tests/mock-escl-scanner.py --bind "$SCANNER_IP" --port 8765 > mock-escl.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail "http://$SCANNER_IP:8765/eSCL/ScannerCapabilities" > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail "http://$SCANNER_IP:8765/eSCL/ScannerCapabilities" > /dev/null
          bash tests/run-escl-network-integration.sh "$SCANNER_IP:8765" jpeg
      - name: Assemble Android debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Validate APK output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK signature and package metadata
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee apk-badging.txt
          grep -F "package: name='com.galaxyuniversalio.debug'" apk-badging.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyUniversalIO-M1-discovery-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/ci-emulator-smoke.sh
      - name: Upload Android runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GalaxyUniversalIO-M1-discovery-emulator-evidence
          path: ci-evidence/
          if-no-files-found: warn
          retention-days: 7

  publish-qa-release:
    name: Publish tested APK as a downloadable QA prerelease
    needs: build
    if: ${{ github.ref == 'refs/heads/galaxy-universal-io-m1-escl-discovery' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download the exactly tested debug APK
        uses: actions/download-artifact@v7
        with:
          name: GalaxyUniversalIO-M1-discovery-debug-apk
          path: release-package
      - name: Stage file, version and SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          source_file=release-package/app-debug.apk
          test -s "$source_file"
          grep -F "versionName '0.13.0'" app/build.gradle
          grep -F "versionCode 19" app/build.gradle
          mv "$source_file" release-package/GalaxyUniversalIO-v0.13.0-QA-debug.apk
          (cd release-package && sha256sum GalaxyUniversalIO-v0.13.0-QA-debug.apk > SHA256SUMS.txt)
          cat release-package/SHA256SUMS.txt
      - name: Publish public GitHub QA prerelease and direct APK asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="galaxy-universal-io-v0.13.0-qa-${GITHUB_SHA:0:8}"
          apk="release-package/GalaxyUniversalIO-v0.13.0-QA-debug.apk"
          checksum="release-package/SHA256SUMS.txt"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Retried CI for this exact commit. Never mutate an existing release silently.
            echo "QA release already exists for this commit: $tag"
          else
            gh release create "$tag" "$apk" "$checksum" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Galaxy Universal I/O 0.13.0 — QA test APK" \
              --notes-file docs/GITHUB_DOWNLOAD.md
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url: .url, assets: [.assets[].name]}'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "GalaxyUniversalIO-v0.13.0-QA-debug.apk" \
            --dir "$RUNNER_TEMP/verify" --clobber
          cmp "$apk" "$RUNNER_TEMP/verify/GalaxyUniversalIO-v0.13.0-QA-debug.apk"
