name: Build OpenScan 3D APK
on:
  workflow_dispatch:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install platform and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify geometry code and Android XML
        run: python3 tools/verify.py
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenScan3D-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
