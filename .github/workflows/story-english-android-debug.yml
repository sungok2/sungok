name: STORY ENGLISH Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [story-english-build]
    paths:
      - 'story-english/source/**'

permissions:
  contents: read

jobs:
  story-english-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout STORY ENGLISH build branch
        uses: actions/checkout@v4
      - name: Check original source before using Android toolchain
        id: source
        shell: bash
        run: |
          python3 story-english/scripts/verify_project.py --github-output "$GITHUB_OUTPUT"
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK platform 37
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0' 'platform-tools'
      - name: Configure Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Restore official wrapper if missing
        shell: bash
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.7.0 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Build debug APK and run tests
        shell: bash
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug test lint 2>&1 | tee "$RUNNER_TEMP/story-english-build.log"
      - name: Record SHA-256 and assert APK exists
        shell: bash
        run: |
          find '${{ steps.source.outputs.project_dir }}' -path '*/build/outputs/apk/debug/*.apk' -type f -print0 | xargs -0 -r sha256sum | tee "$RUNNER_TEMP/story-english-apk-sha256.txt"
          test -s "$RUNNER_TEMP/story-english-apk-sha256.txt"
      - name: Upload APK (private repository or explicit public opt-in only)
        if: ${{ success() && (github.event.repository.private || vars.STORY_ENGLISH_ALLOW_PUBLIC_APK_ARTIFACT == 'yes') }}
        uses: actions/upload-artifact@v4
        with:
          name: story-english-debug-apk
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
