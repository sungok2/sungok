name: STORY ENGLISH 3.7.5 Novel Immersion APK
on:
  push:
    branches: [story-english-3.7.5-novel-reader]
    paths:
      - 'story-english-preview/**'
      - '.github/workflows/story-english-novel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Create ephemeral evaluation signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          K="$RUNNER_TEMP/storyenglish-novel.jks"
          keytool -genkeypair -noprompt -keystore "$K" -storepass "$PASS" -keypass "$PASS" -alias preview -keyalg RSA -keysize 3072 -validity 4 -dname "CN=STORY ENGLISH Novel Evaluation, O=Evaluation Only, C=KR"
          echo "STORY_KEYSTORE=$K" >> "$GITHUB_ENV"
          echo "STORY_KEYPASS=$PASS" >> "$GITHUB_ENV"
      - name: Unit tests, lint and signed evaluation APK
        run: |
          gradle -p story-english-preview :app:verifyPreviewRelease :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature, privacy and video bytes
        shell: bash
        run: |
          set -euo pipefail
          APK="story-english-preview/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/signing.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/manifest.txt
          grep -F "package: name='com.storyenglish.novellab'" /tmp/badging.txt
          grep -F "versionName='3.7.5-novel.1'" /tmp/badging.txt
          grep -F "android.permission.RECORD_AUDIO" /tmp/manifest.txt
          ! grep -F "android.permission.INTERNET" /tmp/manifest.txt
          grep -E 'android:usesCleartextTraffic.*0x0' /tmp/manifest.txt
          grep -E 'android:allowBackup.*0x0' /tmp/manifest.txt
          ! grep -Eq 'android:debuggable.*(0x1|0xffffffff)' /tmp/manifest.txt
          # Audio and player wiring checks are source-based; runtime device QA is separate.
          grep -F 'playOrPrepare(EN[scene][line]' story-english-preview/app/src/main/java/com/storyenglish/preview/MainActivity.java
          grep -F 'requestAudioFocus(focusRequest)' story-english-preview/app/src/main/java/com/storyenglish/preview/MainActivity.java
          # Novel lesson must be integrated into the native Activity and packaged.
          grep -F 'new NovelReaderPanel(' story-english-preview/app/src/main/java/com/storyenglish/preview/MainActivity.java
          grep -F 'ACTION_OPEN_DOCUMENT' story-english-preview/app/src/main/java/com/storyenglish/preview/MainActivity.java
          grep -F 'private void immersionCoach()' story-english-preview/app/src/main/java/com/storyenglish/preview/MainActivity.java
          unzip -Z1 "$APK" | tee /tmp/entries.txt
          MP4_ENTRY="$(grep -E '[.]mp4$' /tmp/entries.txt | head -n 1)"
          test -n "$MP4_ENTRY"
          unzip -p "$APK" "$MP4_ENTRY" > /tmp/embedded_scene.mp4
          cmp /tmp/embedded_scene.mp4 story-english-preview/app/src/main/res/raw/scene_quiet_evening.mp4
          sha256sum /tmp/embedded_scene.mp4 | tee /tmp/embedded_video_sha256.txt
          mkdir -p dist
          cp "$APK" dist/STORY_ENGLISH_3.7.5_STORY_LAB.apk
          cp /tmp/signing.txt /tmp/badging.txt /tmp/manifest.txt /tmp/entries.txt /tmp/embedded_video_sha256.txt dist/
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          echo "OFFLINE MATURE EDUCATIONAL EVALUATION. Synthetic visuals and voices. Self-attested age and temporary signing key, not a production release." > dist/NOT_PRODUCTION_RELEASE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: STORY-ENGLISH-375-STORY-LAB
          path: dist/
          if-no-files-found: error
          retention-days: 30
