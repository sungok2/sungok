name: STORY ENGLISH Prototype Debug APK

on:
  workflow_dispatch:
  push:
    branches: [story-english-build]
    paths:
      - 'story-english/prototype/**'
      - '.github/workflows/story-english-prototype-apk.yml'

permissions:
  contents: read

jobs:
  build-prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile native Compose demo and run unit tests
        shell: bash
        working-directory: story-english/prototype/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Validate and checksum debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK='story-english/prototype/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK" | tee story-english-prototype-apk.sha256
      - name: Upload clearly labeled prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: STORY-ENGLISH-3.7.1-PROTOTYPE-NOT-ORIGINAL-debug-apk
          path: |
            story-english/prototype/android/app/build/outputs/apk/debug/app-debug.apk
            story-english-prototype-apk.sha256
          if-no-files-found: error
          retention-days: 7
