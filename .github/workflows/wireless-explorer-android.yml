name: Wireless Explorer Android APK

on:
  push:
    paths:
      - 'WirelessExplorer/**'
      - '.github/workflows/wireless-explorer-android.yml'
  pull_request:
    paths:
      - 'WirelessExplorer/**'
      - '.github/workflows/wireless-explorer-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: WirelessExplorer
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform from hosted runner
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload Android Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WirelessExplorer-v0.3.0-lint-report
          path: |
            WirelessExplorer/app/build/reports/lint-results-debug.html
            WirelessExplorer/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

      - name: APK integrity hash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WirelessExplorer-v0.3.0-debug-apk
          path: |
            WirelessExplorer/app/build/outputs/apk/debug/app-debug.apk
            WirelessExplorer/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30


  emulator-smoke:
    name: Android 13 emulator UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 13 emulator activity test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            cd WirelessExplorer
            && gradle --no-daemon :app:connectedDebugAndroidTest
            && adb install -r app/build/outputs/apk/debug/app-debug.apk
            && adb shell am start -n kr.sungok.wirelessexplorer/.MainActivity
            && sleep 2
            && adb exec-out screencap -p > ../WirelessExplorer-UI-emulator.png
            && test -s ../WirelessExplorer-UI-emulator.png

      - name: Upload emulator screenshot and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WirelessExplorer-v0.3.0-emulator-qa
          path: |
            WirelessExplorer-UI-emulator.png
            WirelessExplorer/app/build/reports/androidTests/
            WirelessExplorer/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
