name: Wireless Explorer Android APK

on:
  push:
    paths:
      - 'WirelessExplorer/**'
      - '.github/workflows/wireless-explorer-android.yml'
  pull_request:
    paths:
      - 'WirelessExplorer/**'
      - '.github/workflows/wireless-explorer-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: WirelessExplorer
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform from hosted runner
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMGR"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: APK integrity hash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: WirelessExplorer-v0.2.0-debug-apk
          path: |
            WirelessExplorer/app/build/outputs/apk/debug/app-debug.apk
            WirelessExplorer/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
