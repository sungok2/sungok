plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.sungok.wirelessexplorer'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.sungok.wirelessexplorer'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.8.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (System.getenv('WE_RELEASE_KEYSTORE_PATH')) {
            production {
                storeFile file(System.getenv('WE_RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('WE_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('WE_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('WE_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Only owner-signed releases use a persistent private key; regular CI stays debug-only.
            if (signingConfigs.findByName('production') != null) {
                signingConfig signingConfigs.production
            }
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
