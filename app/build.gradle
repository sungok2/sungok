plugins { id 'com.android.application' }
android {
    namespace 'kr.openscan.scan'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.openscan.scan.quality'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.2.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*'] } }
}
dependencies {
    implementation 'com.google.ar:core:1.56.0'
    implementation 'androidx.core:core:1.15.0'
}
