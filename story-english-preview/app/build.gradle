plugins {
    id 'com.android.application'
}
android {
    namespace 'com.storyenglish.preview'
    compileSdk 36
    defaultConfig {
        applicationId 'com.storyenglish.cinematiclab'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.7.3-cinematic.1'
    }
    signingConfigs {
        ephemeral {
            def k = System.getenv('STORY_KEYSTORE')
            if (k) {
                storeFile file(k)
                storePassword System.getenv('STORY_KEYPASS')
                keyAlias 'preview'
                keyPassword System.getenv('STORY_KEYPASS')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            if (System.getenv('STORY_KEYSTORE')) signingConfig signingConfigs.ephemeral
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
tasks.register('verifyPreviewRelease') {
    doLast {
        if (!System.getenv('STORY_KEYSTORE')) throw new GradleException('Signing key missing')
        if (android.buildTypes.release.debuggable) throw new GradleException('Release must not be debuggable')
    }
}
